<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#333" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Frame/Bridge -->
  <path d="M 60,30 Q 200,10 340,30 L 380,30 L 360,40 Q 200,20 40,40 L 20,30 Z" fill="#D4AF37" filter="url(#shadow)"/>
  <!-- Left Lens -->
  <path d="M 30,40 Q 110,30 180,40 C 190,80 160,140 100,140 C 50,140 20,100 30,40 Z" fill="url(#lensGrad)" stroke="#D4AF37" stroke-width="4" filter="url(#shadow)"/>
  <!-- Right Lens -->
  <path d="M 370,40 Q 290,30 220,40 C 210,80 240,140 300,140 C 350,140 380,100 370,40 Z" fill="url(#lensGrad)" stroke="#D4AF37" stroke-width="4" filter="url(#shadow)"/>
  <!-- Highlights -->
  <path d="M 45,50 Q 100,45 130,70" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M 355,50 Q 300,45 270,70" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
</svg>
