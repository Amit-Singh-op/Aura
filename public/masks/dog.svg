<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Left Ear -->
  <path d="M 120,80 Q 60,-20 20,40 Q -10,100 40,160 Q 80,180 120,80 Z" fill="#8B4513" filter="url(#shadow)"/>
  <path d="M 110,90 Q 70,20 40,60 Q 20,100 50,140 Q 80,150 110,90 Z" fill="#D2B48C"/>
  <!-- Right Ear -->
  <path d="M 280,80 Q 340,-20 380,40 Q 410,100 360,160 Q 320,180 280,80 Z" fill="#8B4513" filter="url(#shadow)"/>
  <path d="M 290,90 Q 330,20 360,60 Q 380,100 350,140 Q 320,150 290,90 Z" fill="#D2B48C"/>
  <!-- Dog Nose -->
  <ellipse cx="200" cy="240" rx="35" ry="25" fill="#111" filter="url(#shadow)"/>
  <ellipse cx="210" cy="230" rx="10" ry="5" fill="#555"/>
  <!-- Snout lines -->
  <path d="M 200,265 L 200,300" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M 160,320 Q 200,300 200,300 Q 200,300 240,320" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
