<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Red smile extension -->
  <path d="M 120,280 Q 200,320 280,280 Q 320,220 360,250 Q 280,350 200,350 Q 120,350 40,250 Q 80,220 120,280 Z" fill="#b01010" filter="url(#blur)" opacity="0.85"/>
  <!-- Blue Eye Diamonds -->
  <polygon points="120,100 150,150 120,200 90,150" fill="#1040b0" filter="url(#blur)" opacity="0.75"/>
  <polygon points="280,100 310,150 280,200 250,150" fill="#1040b0" filter="url(#blur)" opacity="0.75"/>
  <!-- Red Nose Tip -->
  <circle cx="200" cy="230" r="25" fill="#b01010" filter="url(#blur)" opacity="0.9"/>
</svg>
